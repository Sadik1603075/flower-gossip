version: '3.8'

services:
  # Server-2 (Laptop 2)
  server-2:
    container_name: server-2
    build:
      context: .
      dockerfile: Dockerfile
    command: python fault_tolerant_server.py --node_id=server-2 --port=8080 --gossip_port=9002 --num_rounds=50
    environment:
      FLASK_RUN_PORT: 6001
      DOCKER_HOST_IP: host.docker.internal
      NODE_ID: server-2
      GOSSIP_PORT: 9002
      FL_PORT: 8080
      PEERS: 192.168.1.14:9001,192.168.1.13:9003
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "6001:6001"
      - "8081:8080"  # FL server port
      - "8002:8000"  # Metrics port
      - "9002:9002"  # Gossip port
    stop_signal: SIGINT
    deploy:
      restart_policy:
        condition: on-failure

  # Client-2 (Laptop 2)
  client2:
    container_name: client2
    build:
      context: .
      dockerfile: Dockerfile
    command: python client.py --server_address=server-2:8080 --data_percentage=0.6 --client_id=2 --total_clients=3 --batch_size=32 --learning_rate=0.05
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "1"
          memory: "1g"
        reservations:
          cpus: "0.5"
          memory: "512m"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "7002:7002"
    depends_on:
      - server-2
    environment:
      FLASK_RUN_PORT: 7002
      container_name: client2
      DOCKER_HOST_IP: host.docker.internal
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:7002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
