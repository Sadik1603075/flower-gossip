version: '3.8'

services:
  # Server-3 (Laptop 3)
  server-3:
    container_name: server-3
    build:
      context: .
      dockerfile: Dockerfile
    command: python fault_tolerant_server.py --node_id=server-3 --port=8080 --gossip_port=9003 --num_rounds=50
    environment:
      FLASK_RUN_PORT: 6002
      DOCKER_HOST_IP: host.docker.internal
      NODE_ID: server-3
      GOSSIP_PORT: 9003
      FL_PORT: 8080
      PEERS: 192.168.1.14:9001,192.168.1.12:9002
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "6002:6002"
      - "8082:8080"  # FL server port
      - "8003:8000"  # Metrics port
      - "9003:9003"  # Gossip port
    stop_signal: SIGINT
    deploy:
      restart_policy:
        condition: on-failure

  # Client-3 (Laptop 3)
  client3:
    container_name: client3
    build:
      context: .
      dockerfile: Dockerfile
    command: python client.py --server_address=server-3:8080 --data_percentage=0.6 --client_id=3 --total_clients=3 --batch_size=32 --learning_rate=0.02
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "1"
          memory: "1g"
        reservations:
          cpus: "0.5"
          memory: "512m"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "7003:7003"
    depends_on:
      - server-3
    environment:
      FLASK_RUN_PORT: 7003
      container_name: client3
      DOCKER_HOST_IP: host.docker.internal
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:7003/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
