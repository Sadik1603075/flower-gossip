version: '3.8'

services:
  # Monitoring Stack (Only on Laptop 1)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - 9090:9090
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - --config.file=/etc/prometheus/prometheus-multi-laptop.yml
    volumes:
      - ./config/prometheus-multi-laptop.yml:/etc/prometheus/prometheus-multi-laptop.yml:ro
    depends_on:
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    privileged: true
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - 3000:3000
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./config/grafana.ini:/etc/grafana/grafana.ini
      - ./config/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./config/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
      - cadvisor
    command:
      - --config=/etc/grafana/grafana.ini

  # Server-1 (Laptop 1)
  server-1:
    container_name: server-1
    build:
      context: .
      dockerfile: Dockerfile
    command: python fault_tolerant_server.py --node_id=server-1 --port=8080 --gossip_port=9001 --num_rounds=50
    environment:
      FLASK_RUN_PORT: 6000
      DOCKER_HOST_IP: host.docker.internal
      NODE_ID: server-1
      GOSSIP_PORT: 9001
      FL_PORT: 8080
      PEERS: 192.168.1.12:9002,192.168.1.13:9003
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "6000:6000"
      - "8080:8080"
      - "8001:8000"  # Metrics port
      - "9001:9001"  # Gossip port
    stop_signal: SIGINT
    depends_on:
      - prometheus
      - grafana
    deploy:
      restart_policy:
        condition: on-failure

  # Client-1 (Laptop 1)
  client1:
    container_name: client1
    build:
      context: .
      dockerfile: Dockerfile
    command: python client.py --server_address=server-1:8080 --data_percentage=0.6 --client_id=1 --total_clients=3 --batch_size=32 --learning_rate=0.01
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "1"
          memory: "1g"
        reservations:
          cpus: "0.5"
          memory: "512m"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "7001:7001"
    depends_on:
      - server-1
    environment:
      FLASK_RUN_PORT: 7001
      container_name: client1
      DOCKER_HOST_IP: host.docker.internal
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:7001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  grafana-storage:
